{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "mcp-hangar-operator.fullname" . }}
  {{- if .Values.prometheusRule.namespace }}
  namespace: {{ .Values.prometheusRule.namespace }}
  {{- end }}
  labels:
    {{- include "mcp-hangar-operator.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ include "mcp-hangar-operator.fullname" . }}
      {{- if .Values.prometheusRule.rules }}
      rules:
        {{- toYaml .Values.prometheusRule.rules | nindent 8 }}
      {{- else }}
      rules:
        - alert: MCPOperatorReconcileErrors
          expr: sum by (controller) (rate(controller_runtime_reconcile_errors_total[5m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "MCP Operator reconcile errors detected"
            description: "Controller {{ "{{" }} $labels.controller {{ "}}" }} has reconcile errors (current value: {{ "{{" }} $value {{ "}}" }})"
        - alert: MCPOperatorDown
          # `-metrics` is not decoration: the ServiceMonitor sets no `jobLabel`,
          # so Prometheus Operator names the job after the Service it selects,
          # and that Service is `{{ include "mcp-hangar-operator.fullname" . }}-metrics`
          # (templates/service.yaml). Without the suffix this equality matcher
          # selected nothing and the alert could not fire at all (#213).
          # scripts/check_operator_job_label.py holds the two together.
          expr: up{job="{{ include "mcp-hangar-operator.fullname" . }}-metrics"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "MCP Operator is down"
            description: "MCP Operator has been unreachable for 5 minutes"
      {{- end }}
{{- end }}
