{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mcp-hangar-operator.fullname" . }}
  labels:
    {{- include "mcp-hangar-operator.labels" . | nindent 4 }}
rules:
  # ==========================================================================
  # MCP CRDs
  # ==========================================================================
  - apiGroups:
      - mcp-hangar.io
    resources:
      - mcpservers
      - mcpservergroups
      - mcpdiscoverysources
      - mcpegresspolicies
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  - apiGroups:
      - mcp-hangar.io
    resources:
      - mcpservers/status
      - mcpservergroups/status
      - mcpdiscoverysources/status
      - mcpegresspolicies/status
    verbs:
      - get
      - patch
      - update

  - apiGroups:
      - mcp-hangar.io
    resources:
      - mcpservers/finalizers
      - mcpservergroups/finalizers
      - mcpdiscoverysources/finalizers
      - mcpegresspolicies/finalizers
    verbs:
      - update

  # ==========================================================================
  # Pod Management
  # ==========================================================================
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  # ==========================================================================
  # ConfigMaps (read-only, for ConfigMap discovery sources). No Secrets and no
  # ServiceAccounts: nothing in the operator reads either -- a pod's secret
  # and service-account references are resolved by the kubelet -- and the
  # grant was cluster-wide read on every Secret (operator #194).
  # ==========================================================================
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch

  # ==========================================================================
  # Services (for discovery)
  # ==========================================================================
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch

  # ==========================================================================
  # Namespaces (for namespace discovery)
  # ==========================================================================
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch

  # ==========================================================================
  # NetworkPolicies (for provider network isolation)
  # ==========================================================================
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  # ==========================================================================
  # DaemonSets (read-only, for the enforcement probe). The operator recognises
  # a CNI that ships no CRDs (kube-router, Azure NPM, Weave Net, calico-node
  # installed without its CRDs) by its agent DaemonSet. Without this grant the
  # probe cannot see the agent and reports enforcement as Unknown. Read through
  # an uncached reader, so get/list without watch is enough.
  # ==========================================================================
  - apiGroups:
      - apps
    resources:
      - daemonsets
    verbs:
      - get
      - list

  {{- if .Values.rbac.ciliumNetworkPolicies }}
  # ==========================================================================
  # CiliumNetworkPolicies (FQDN-aware egress backstop; MCPEgressPolicy flavor
  # Cilium/Auto). Without this the operator cannot apply the Cilium backstop and
  # the MCPEgressPolicy stays Compiled but silently un-enforced. Inert (the API
  # group does not exist) on clusters without Cilium, so safe to grant by default.
  # ==========================================================================
  - apiGroups:
      - cilium.io
    resources:
      - ciliumnetworkpolicies
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  {{- end }}

  # ==========================================================================
  # Events (for recording events)
  #
  # Both API groups: the operator records through the events.k8s.io/v1
  # recorder, while controller-runtime leader election still emits via the
  # legacy core API. Dropping "" breaks leader election.
  # ==========================================================================
  - apiGroups:
      - ""
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch

  # ==========================================================================
  # Leader Election
  # ==========================================================================
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - get
      - list
      - update

  {{- with .Values.rbac.additionalRules }}
  # ==========================================================================
  # Additional Custom Rules
  # ==========================================================================
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
