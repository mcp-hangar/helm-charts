{{- if .Values.rbac.create -}}
{{- /*
  The rules are the operator's own, vendored from its release by
  scripts/vendor-operator-crds.py (#315): files/rbac/role.yaml is what
  controller-gen derives from the operator's +kubebuilder:rbac markers, and
  files/rbac/leader_election_role.yaml is the lock it takes. A hand-kept copy
  needed five catch-ups since July; this one moves with the appVersion.

  Three things stay the chart's: the Cilium grant (inert without Cilium, but a
  release may not want it), the metrics TokenReview/SubjectAccessReview rules
  (only needed when operator.metrics.secure), and rbac.additionalRules.
*/ -}}
{{- $role := .Files.Get "files/rbac/role.yaml" | fromYaml -}}
{{- $lock := .Files.Get "files/rbac/leader_election_role.yaml" | fromYaml -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mcp-hangar-operator.fullname" . }}
  labels:
    {{- include "mcp-hangar-operator.labels" . | nindent 4 }}
rules:
  {{- range $rule := $role.rules }}
  {{- $cilium := has "cilium.io" $rule.apiGroups }}
  {{- $review := or (has "authentication.k8s.io" $rule.apiGroups) (has "authorization.k8s.io" $rule.apiGroups) }}
  {{- if and (or (not $cilium) $.Values.rbac.ciliumNetworkPolicies) (or (not $review) $.Values.operator.metrics.secure) }}
  {{- toYaml (list $rule) | nindent 2 }}
  {{- end }}
  {{- end }}
  {{- if .Values.operator.leaderElection.enabled }}
  {{- toYaml $lock.rules | nindent 2 }}
  {{- end }}
  {{- with .Values.rbac.additionalRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
