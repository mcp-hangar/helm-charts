{{- if .Values.webhook.enabled }}
{{- $_ := include "mcp-hangar-operator.webhookCertSecret" . }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "mcp-hangar-operator.fullname" . }}
  labels:
    {{- include "mcp-hangar-operator.labels" . | nindent 4 }}
  {{- if .Values.webhook.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "mcp-hangar-operator.fullname" . }}-webhook
  {{- end }}
webhooks:
  # The operator registers a validating admission webhook for every served
  # version of every kind that has spec constraints. Since operator 0.16.0
  # that is exactly one version -- v1alpha2 (v1alpha1 unserved and deleted,
  # operator #125) -- so exactly these entries must be wired here, or
  # admission for that kind is silently unreachable (issue #32).
  # MCPServerGroup has no webhook: its one rule, spec.selector set, is the
  # CRD schema's `required` (operator #197).
  - name: vmcpserver-v1alpha2.mcp-hangar.io
    admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: {{ include "mcp-hangar-operator.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-mcp-hangar-io-v1alpha2-mcpserver
        port: 443
      {{- if not .Values.webhook.certManager.enabled }}
      caBundle: {{ .Values.webhook.caBundle }}
      {{- end }}
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    matchPolicy: Equivalent
    rules:
      - apiGroups:
          - mcp-hangar.io
        apiVersions:
          - v1alpha2
        operations:
          - CREATE
          - UPDATE
        resources:
          - mcpservers
        scope: Namespaced
    sideEffects: None
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
  - name: vmcpdiscoverysource-v1alpha2.mcp-hangar.io
    admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: {{ include "mcp-hangar-operator.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-mcp-hangar-io-v1alpha2-mcpdiscoverysource
        port: 443
      {{- if not .Values.webhook.certManager.enabled }}
      caBundle: {{ .Values.webhook.caBundle }}
      {{- end }}
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    matchPolicy: Equivalent
    rules:
      - apiGroups:
          - mcp-hangar.io
        apiVersions:
          - v1alpha2
        operations:
          - CREATE
          - UPDATE
        resources:
          - mcpdiscoverysources
        scope: Namespaced
    sideEffects: None
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
  {{- if .Values.webhook.podRegistration.enabled }}
  # Pod-registration webhook (operator #50/#69): rejects a Pod labelled
  # mcp-hangar.io/provider=<name> on CREATE when no MCPServer <name> is
  # registered in its namespace -- unregistered instances fail deployment
  # (OWASP MCP09), not just get firewalled by the phase-1 default-deny.
  # UPDATE is gated too (operator #189, needs operator >= 0.17.5): the label
  # is immutable once the pod is admitted, so a pod cannot be relabelled into
  # a registered server's egress. An older operator re-runs the CREATE check
  # on UPDATE, which denies finalizer/ownerRef patches on a labelled pod whose
  # MCPServer is gone -- do not ship this rule to an operator before 0.17.5.
  #
  # failurePolicy is pinned to Fail (not webhook.failurePolicy): a soft policy
  # would let an unavailable operator silently admit unregistered pods,
  # defeating the guarantee. That is only safe because namespaceSelector scopes
  # the webhook to opted-in namespaces (mcp-hangar.io/enforce-egress=true) --
  # without it, an unavailable webhook would block ALL pod creation
  # cluster-wide. Both are intentionally hardcoded and must stay coupled.
  - name: vpod-registration.kb.io
    admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: {{ include "mcp-hangar-operator.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-pod-registration
        port: 443
      {{- if not .Values.webhook.certManager.enabled }}
      caBundle: {{ .Values.webhook.caBundle }}
      {{- end }}
    failurePolicy: Fail
    matchPolicy: Equivalent
    namespaceSelector:
      matchLabels:
        mcp-hangar.io/enforce-egress: "true"
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
        scope: Namespaced
    sideEffects: None
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
  {{- end }}
{{- end }}
