{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "mcp-hangar-operator.fullname" . }}
  labels:
    {{- include "mcp-hangar-operator.labels" . | nindent 4 }}
spec:
  {{- /* One of the two, never both: the API server refuses a budget that sets both.
         minAvailable wins when a release sets it, so the chart's maxUnavailable
         default does not turn that release's values into an invalid object. */}}
  {{- if kindIs "invalid" .Values.podDisruptionBudget.minAvailable | not }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- else if not (kindIs "invalid" .Values.podDisruptionBudget.maxUnavailable) }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mcp-hangar-operator.selectorLabels" . | nindent 6 }}
{{- end }}
