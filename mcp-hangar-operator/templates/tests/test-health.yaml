apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "mcp-hangar-operator.fullname" . }}-test-health"
  labels:
    {{- include "mcp-hangar-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  automountServiceAccountToken: false
  containers:
    # A TCP connect, not an HTTP GET: with operator.metrics.secure the endpoint
    # serves HTTPS and refuses a request without an authorized token, so a GET
    # would fail on a healthy operator (operator #193). A NetworkPolicy
    # restricted with networkPolicy.metricsFrom must admit this pod's namespace.
    - name: probe
      image: busybox:1.37
      command: ['nc']
      args: ['-z', '-w', '5', '{{ include "mcp-hangar-operator.fullname" . }}-metrics', '{{ .Values.operator.metrics.port }}']
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
  restartPolicy: Never
