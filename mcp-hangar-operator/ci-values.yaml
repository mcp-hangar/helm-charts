# Production-like values for CI dry-run testing.
# This file is used in CI to validate template rendering with realistic
# configuration. It is NOT intended for actual deployment.

replicaCount: 2

operator:
  logLevel: info
  leaderElection:
    enabled: true
    leaseDuration: "15s"
    renewDeadline: "10s"
    retryPeriod: "2s"
  networkPolicyEnforcement: enforced
  dnsEgressCIDRs:
    - "169.254.20.10/32"
  dnsEgressSelectors:
    - "openshift-dns/dns.operator.openshift.io/daemonset-dns=default"
    - "dns/app=resolver,tier=edge"
  imageDigestPolicy: block
  metrics:
    port: 8080
    secure: true
    readers:
      - name: prometheus-k8s
        namespace: monitoring
  gracefulShutdown:
    timeout: "10s"
    terminationGracePeriodSeconds: 15

webhook:
  enabled: true
  certManager:
    enabled: true
    issuerKind: ClusterIssuer
    issuerName: "letsencrypt-prod"
  failurePolicy: Fail

hangar:
  url: "http://mcp-hangar.hangar-system.svc.cluster.local:8080"
  gatewaySelector: "app.kubernetes.io/name=mcp-hangar,app.kubernetes.io/component in (gateway,frontdoor)"
  tls:
    ca:
      configMapName: "mcp-hangar-core-ca"
    serverName: "mcp-hangar.hangar-system.svc"

serviceMonitor:
  enabled: true
  interval: 30s

prometheusRule:
  enabled: true

networkPolicy:
  enabled: true
  allowMonitoring: true
  metricsFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring

podDisruptionBudget:
  enabled: true
  minAvailable: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
