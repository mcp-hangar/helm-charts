# MCP-Hangar Operator Configuration
# ===================================

# Replica count for operator deployment.
#
# Defaults to 1. The operator gates /readyz on winning leader election
# (operator.leaderElection.enabled=true): only the elected leader reports
# Ready, and standby replicas legitimately stay NotReady until they win
# leadership. That's correct steady-state behavior, but with
# `helm install/upgrade --wait`, Helm waits for ALL Pods in the Deployment
# to become Ready -- with replicaCount >= 2 it will wait for every standby
# to also become the leader, which never happens, and the wait times out
# (issue #26).
#
# Set replicaCount >= 2 for HA once you're not relying on `helm --wait`
# to gate on Deployment readiness (e.g. CI/CD that polls a different
# signal, or accepts that standby replicas report NotReady by design).
replicaCount: 1

# Deployment update strategy. The same leader-gated readiness above also
# breaks a RollingUpdate: it surges a new Pod that cannot become Ready until
# the old leader releases its lease, but the old Pod is not terminated until
# the new one is Ready -- so the rollout deadlocks and `helm upgrade --wait`
# times out. `Recreate` terminates the old Pod first (releasing the lease),
# then starts the new one, which then acquires leadership and becomes Ready.
# Override to RollingUpdate only for HA (replicaCount >= 2) where you have
# accounted for the leader-gating interaction.
updateStrategy: Recreate

# Operator image configuration
image:
  repository: ghcr.io/mcp-hangar/mcp-hangar-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag (defaults to chart appVersion)
  tag: ""

# Image pull secrets for private registries
imagePullSecrets: []

# Override chart name
nameOverride: ""
fullnameOverride: ""

# ServiceAccount configuration
serviceAccount:
  # Create a service account
  create: true
  # Annotations for the service account
  annotations: {}
  # Name override (generated if empty)
  name: ""

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  # The image's own USER (distroless nonroot).
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# =============================================================================
# Operator Configuration
# =============================================================================
operator:
  # Log level passed to the manager via --zap-log-level (controller-runtime's
  # zap logging flag). Accepts: debug, info, error, or an integer verbosity
  # level (e.g. "2"). Note: "warn" is NOT a supported value.
  logLevel: info

  # Metrics configuration. There is no `enabled:` key -- the manager always
  # binds its metrics address, so a flag here could not turn them off.
  metrics:
    # Metrics bind port
    port: 8080
    # Serve /metrics over HTTPS (self-signed, generated in memory) and admit
    # only a bearer token the API server authenticates and authorizes for get
    # on the /metrics non-resource URL. Operator 0.17.10 and later serve it
    # this way by default; false renders --metrics-secure=false and restores
    # plain, unauthenticated HTTP (operator #193).
    secure: true
    # ServiceAccounts allowed to scrape: each gets a ClusterRoleBinding to the
    # chart's metrics-reader ClusterRole. With secure metrics a scraper that is
    # not bound to it (or to another role allowing get on /metrics) gets 403.
    # Example: [{name: prometheus-k8s, namespace: monitoring}]
    readers: []

  # Health probe configuration
  health:
    # Health probe bind port
    port: 8081

  # Leader election for HA
  leaderElection:
    # Enable leader election
    enabled: true
    # Namespace for leader election lease (defaults to release namespace)
    namespace: ""
    # Duration that non-leader candidates will wait after observing a
    # leadership renewal before attempting to acquire the lease
    leaseDuration: "15s"
    # Interval between attempts by the acting leader to renew the lease
    renewDeadline: "10s"
    # Duration between leader election retries
    retryPeriod: "2s"

  # Whether the cluster enforces NetworkPolicy (--networkpolicy-enforcement).
  # Empty leaves the operator default ("auto"): the operator looks for a CNI
  # that enforces policy and, when it finds none, reports MCPServer
  # NetworkPolicyApplied as False, an MCPEgressPolicy backstop as Unenforced and
  # warns on enforce-egress namespaces. "enforced" asserts enforcement for a CNI
  # the operator cannot recognise; "unenforced" asserts there is none.
  # Requires operator 0.17.3 or newer.
  networkPolicyEnforcement: ""

  # Extra CIDRs appended to every generated DNS egress rule (--dns-egress-cidrs),
  # in addition to the in-cluster kube-dns pods. Set this to the NodeLocal
  # DNSCache or custom resolver address (e.g. "169.254.20.10/32") on clusters
  # where pods do not resolve through the kube-dns pods; otherwise DNS is
  # blocked for egress-scoped servers.
  dnsEgressCIDRs: []

  # Resolver pods, other than kube-system/k8s-app=kube-dns, that DNS egress may
  # reach (--dns-egress-selectors), each "<namespace>/<key>=<value>[,...]" with
  # at least one label. Needed on OpenShift/OKD
  # ("openshift-dns/dns.operator.openshift.io/daemonset-dns=default") or with a
  # custom resolver Deployment; a Service ClusterIP cannot be allowed with
  # dnsEgressCIDRs. Unlike dnsEgressCIDRs this also reaches the Cilium
  # backstop. Requires operator 0.17.9 or newer.
  dnsEgressSelectors: []

  # How admission treats container images that are not digest-pinned
  # (--image-digest-policy): "block" rejects, "warn" adds an admission warning,
  # "off" ignores. Empty leaves the operator default ("warn"). Only takes effect
  # with the webhook enabled.
  imageDigestPolicy: ""

  # Further operator flags, appended verbatim after the ones this chart renders
  # (e.g. ["--max-concurrent-reconciles=8"]), for a flag with no dedicated
  # value above. A flag the chart already renders is then passed twice, and the
  # operator keeps the last one.
  extraArgs: []

  # Graceful shutdown settings
  gracefulShutdown:
    # Maximum duration the manager waits for running reconcilers on shutdown.
    # Must be less than terminationGracePeriodSeconds.
    timeout: "10s"
    # terminationGracePeriodSeconds for the pod. Must be greater than
    # gracefulShutdown.timeout to allow the manager to drain work before
    # the kubelet force-kills the process.
    terminationGracePeriodSeconds: 15

# =============================================================================
# MCP-Hangar Core Connection
# =============================================================================
hangar:
  # URL of MCP-Hangar core service
  # Set to empty to run without Hangar core integration
  url: ""
  # Example: "http://mcp-hangar.mcp-hangar.svc.cluster.local:8080"

  # API key for authentication
  apiKey: ""

  # Reference existing secret for API key
  existingSecret: ""
  # Key in the secret containing the API key
  secretKey: "api-key"

  # Label selector for the core gateway pods. When one of them becomes Ready,
  # the operator re-delivers every MCPEgressPolicy's L7 policy to it, so a
  # gateway that restarted on a memory-only backend gets its policies back.
  # Empty means the operator's built-in default, app.kubernetes.io/name=mcp-hangar,
  # which matches the mcp-hangar chart. A gateway deployed any other way (for
  # example one labelled app.kubernetes.io/name=hangar-frontdoor-ha) matches
  # nothing under the default and must set this. Any Kubernetes label selector
  # works, including "a=b,c=d" and "tier in (gateway,frontdoor)".
  # Rendered as --hangar-gateway-selector, which needs operator 0.17.4 or later:
  # an older image exits on the unknown flag, so leave this empty (and
  # gatewayWatch.enabled true) when pinning image.tag below 0.17.4.
  gatewaySelector: ""

  gatewayWatch:
    # false turns the gateway pod watch off (renders --hangar-gateway-selector=
    # with an empty value); gatewaySelector is then ignored. Operator >= 0.17.4.
    enabled: true

  # TLS for an https hangar.url whose certificate a private CA signed. The CA
  # bundle (PEM) comes from a Secret or a ConfigMap in the release namespace,
  # is mounted read-only and passed as --hangar-ca-file; it is trusted in
  # addition to the system roots. Operator >= 0.17.11.
  tls:
    ca:
      # Set one of the two.
      secretName: ""
      configMapName: ""
      # Key holding the PEM bundle.
      key: "ca.crt"
    # Name to verify core's certificate against when hangar.url uses an address
    # the certificate does not name (--hangar-tls-server-name). Needs a CA above.
    serverName: ""

# =============================================================================
# Resource Limits
# =============================================================================
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# =============================================================================
# Scheduling
# =============================================================================

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - mcp-hangar-operator
          topologyKey: kubernetes.io/hostname

# Priority class
priorityClassName: ""

# Topology spread constraints
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: mcp-hangar-operator

# =============================================================================
# Admission Webhooks
# =============================================================================
webhook:
  # Enable validating admission webhooks
  enabled: false
  # No `port:` key: controller-runtime binds 9443 and the image takes no flag
  # to move it, so the containerPort and NetworkPolicy hardcode 9443. The
  # Service still fronts it on 443.
  # cert-manager integration for webhook TLS
  certManager:
    # Use cert-manager to provision webhook certificates
    enabled: true
    # Issuer kind (Issuer or ClusterIssuer)
    issuerKind: Issuer
    # Issuer name (auto-created self-signed issuer if empty)
    issuerName: ""
    # Certificate duration
    duration: "8760h"  # 1 year
    # Certificate renewal window
    renewBefore: "720h"  # 30 days
  # Without cert-manager (certManager.enabled=false) you bring the serving
  # certificate: a kubernetes.io/tls Secret with tls.crt and tls.key, valid for
  # <fullname>-webhook.<namespace>.svc, and the base64 PEM of the CA that
  # signed it. The render fails if either is missing, since a webhook the
  # apiserver cannot verify rejects every write under failurePolicy Fail.
  existingSecret: ""
  caBundle: ""
  # Failure policy for webhook (Fail or Ignore)
  failurePolicy: Fail
  # Timeout in seconds for webhook calls
  timeoutSeconds: 10
  # Pod-registration admission webhook (operator #50/#69). Rejects pods
  # labelled mcp-hangar.io/provider=<name> when no MCPServer <name> is
  # registered in the namespace. Off by default: it is the stronger
  # enforcement posture and only acts in namespaces labelled
  # mcp-hangar.io/enforce-egress=true (the webhook is namespace-scoped and
  # failurePolicy: Fail). Enable once your governed namespaces carry that
  # label. Requires webhook.enabled=true.
  podRegistration:
    enabled: false

# =============================================================================
# CRD Management
# =============================================================================
# CRDs are delivered via templates/crds/ only (a single, release-owned path).
# There is no separate top-level crds/ directory: shipping CRDs through both
# Helm's native crds/ dir (unmanaged, always applied on `helm install`) and
# templates/crds/ (release-owned, gated by crds.install) at the same time
# causes a Helm ownership/duplicate conflict on install. Keeping only the
# templates/crds/ path makes the CRDs upgradeable and lets `crds.install`
# and `crds.keep` actually take effect.
crds:
  # Install CRDs (templates/crds/). Disable if CRDs are managed out-of-band
  # (e.g. a separate cluster-admin step, or `helm install --skip-crds`).
  install: true
  # Keep CRDs on helm uninstall by setting the helm.sh/resource-policy: keep
  # annotation, so `helm uninstall` does not cascade-delete the CRDs (and
  # with them every MCPServer/MCPServerGroup/MCPDiscoverySource resource).
  keep: true

# =============================================================================
# RBAC Configuration
# =============================================================================
rbac:
  # Create RBAC resources
  create: true
  # Grant RBAC for cilium.io CiliumNetworkPolicy so the operator's Cilium/Auto
  # egress-backstop flavor can enforce FQDN upstreams (MCPEgressPolicy). Harmless
  # (the API group is absent) on non-Cilium clusters; required on Cilium ones,
  # otherwise the backstop silently fails with a forbidden error.
  ciliumNetworkPolicies: true
  # Additional rules for ClusterRole
  additionalRules: []
  # Example:
  # - apiGroups: [""]
  #   resources: ["persistentvolumeclaims"]
  #   verbs: ["get", "list", "watch"]

# =============================================================================
# Monitoring
# =============================================================================

# ServiceMonitor for Prometheus Operator
serviceMonitor:
  # Enable ServiceMonitor
  enabled: false
  # Namespace (defaults to release namespace)
  namespace: ""
  # Scrape interval
  interval: 30s
  # Scrape timeout
  scrapeTimeout: 10s
  # Additional labels
  labels: {}
  # Metric relabeling
  metricRelabelings: []
  # Target relabeling
  relabelings: []

# PrometheusRule for alerting
prometheusRule:
  # Enable PrometheusRule
  enabled: false
  # Namespace (defaults to release namespace)
  namespace: ""
  # Additional labels
  labels: {}
  # Alert rules
  rules: []
  # Example rules are generated if empty and enabled

# =============================================================================
# Network Policies
# =============================================================================
networkPolicy:
  # Enable network policies
  enabled: true
  # Allow ingress from monitoring namespace
  allowMonitoring: true
  # Who may reach the metrics port, as NetworkPolicy peers. Empty keeps it
  # reachable from any pod (secure metrics still refuse an unauthorized
  # scrape); set it to narrow the port to your monitoring namespace, e.g.
  # [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}]
  metricsFrom: []
  # Additional ingress rules
  additionalIngress: []
  # Additional egress rules
  additionalEgress: []

# =============================================================================
# Pod Disruption Budget
# =============================================================================
podDisruptionBudget:
  # Enable PDB
  enabled: true
  # Minimum available pods
  minAvailable: 1
  # Maximum unavailable pods (alternative to minAvailable)
  # maxUnavailable: 1
