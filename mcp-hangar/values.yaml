# MCP-Hangar Server Configuration

replicaCount: 1

image:
  repository: ghcr.io/mcp-hangar/mcp-hangar
  pullPolicy: IfNotPresent
  tag: ""  # Defaults to appVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: false

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: mcp-hangar.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - mcp-hangar
          topologyKey: kubernetes.io/hostname

# MCP-Hangar specific configuration
config:
  mode: http
  port: 8080
  logLevel: INFO
  jsonLogs: true
  # The 1.5 server refuses to bind HTTP on a non-loopback interface unless
  # either an `auth` block is configured below or this is set to true.
  # Leave this false and configure `auth` for any non-demo deployment.
  unsafeNoAuth: false

# Storage, as one decision (core 2.5.0+). Leave `backend` empty to keep the
# pre-2.5.0 behaviour, where each subsystem configured its own storage.
#
# A backend serves every persisted concern or the gateway refuses to start:
# the event log and its delivery mark, server configuration, the audit trail,
# saga state, approvals, API keys, roles, tool-access policies, metric history
# and the management lease.
persistence:
  # "" | sqlite | postgresql
  backend: ""

  sqlite:
    dataDir: /app/data
    # The chart's `data` volume is an emptyDir by default, which means a pod
    # restart loses the event log and the fleet. Turn this on for any
    # deployment whose history matters.
    persistentVolume:
      enabled: false
      size: 8Gi
      storageClass: ""
      accessMode: ReadWriteOnce

  postgresql:
    host: ""
    port: 5432
    database: mcp_hangar
    user: hangar
    # Prefer `existingSecret`. A password set here is rendered into a
    # ConfigMap, which is readable by anything that can read ConfigMaps.
    password: ""
    # A Secret holding the password. When set, the chart mounts it as
    # HANGAR_DB_PASSWORD and the rendered config interpolates that instead.
    existingSecret: ""
    existingSecretKey: password

# Declares that these replicas are meant to be ONE gateway rather than several
# independent ones (core 2.5.0+). Required for more than one replica, and
# refused on a backend the replicas cannot share.
#
# Exactly one replica holds the management lease and runs discovery, garbage
# collection, TTL deregistration and metric snapshots. Every replica serves.
coordination:
  enabled: false
  # Keep these IDENTICAL on every replica. The tenure in force is written by
  # whichever replica holds the lease, from its own value -- so one stale
  # ConfigMap sets the failover window for the whole set.
  leaseTtlSeconds: 15
  renewIntervalSeconds: 5
  # Must be under leaseTtlSeconds.
  renewDeadlineSeconds: 10

# MCP servers configuration
mcp_servers: {}
  # example:
  #   math:
  #     mode: remote
  #     endpoint: http://math.internal:8000/mcp
  #
  # `subprocess`, `docker` and `container` run the server as a child process of
  # ONE gateway, so no peer can reach it. They are refused when
  # `coordination.enabled` is true -- use `remote` for anything several
  # replicas must serve.

# Auth configuration, rendered into config.yaml's top-level `auth:` section.
# Required for the server to bind HTTP on a non-loopback interface unless
# config.unsafeNoAuth is set to true (demo/insecure only).
auth: {}

# Prometheus ServiceMonitor
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

# ── Prometheus alerting rules ──────────────────────────────────────────────
# Ships the maintained application alert rules (28 alerts across critical/
# warning/info/governance/availability groups) as a PrometheusRule CR. Requires
# the Prometheus Operator CRDs (monitoring.coreos.com/v1); enabling without them
# fails the render with a clear message. Off by default; turn on where Prometheus
# Operator is present.
prometheusRule:
  enabled: false
  # namespace: monitoring          # default: release namespace
  additionalLabels: {}             # e.g. { release: kube-prometheus-stack }

# ── Grafana dashboards ─────────────────────────────────────────────────────
# Ships the 4 maintained dashboards (overview / governance / provider-details /
# alerts) as ConfigMaps labeled for the Grafana sidecar to auto-import. Off by
# default; enable when running the Grafana sidecar.
dashboards:
  enabled: false
  sidecarLabel: grafana_dashboard
  sidecarLabelValue: "1"
  folder: "MCP Hangar"
  folderAnnotation: grafana_folder

# ConfigMap for hangar config.yaml
configMap:
  create: true

# ── Network Policy ─────────────────────────────────────────────────────

networkPolicy:
  enabled: true
  # Allow ingress from the monitoring namespace (Prometheus scraping) on the service port
  allowMonitoring: true
  # Namespace label (kubernetes.io/metadata.name) that Prometheus/monitoring runs in.
  # Only used when allowMonitoring is true.
  monitoringNamespace: monitoring
  # Additional ingress rules (appended as-is; use to allow other namespaces/peers)
  additionalIngress: []
  # Allow egress to any pod in the release namespace (all ports/protocols).
  # Covers co-located MCP backends (mcp_servers.*.mode: remote endpoints running
  # in this namespace) as well as the helm-test connection hook pod reaching the
  # gateway. Disable only if you scope backend access via additionalEgress instead.
  allowSameNamespaceEgress: true
  # Allow egress on 443/TCP to anywhere. Needed for OIDC issuer/JWKS discovery
  # and for remote MCP backends reachable over HTTPS outside the release
  # namespace.
  allowHTTPSEgress: true
  # Additional egress rules (appended as-is). Required for anything not covered
  # above, e.g.:
  #   - MCP backends running in a different namespace or outside the cluster
  #     (add a namespaceSelector/podSelector rule, or a to.ipBlock/to.ipBlock+
  #     ports rule for external endpoints)
  #   - Non-443 external endpoints (OIDC on a nonstandard port, plaintext HTTP
  #     backends outside the release namespace, etc.)
  additionalEgress: []

# ── Extra environment ──────────────────────────────────────────────────

# Appended to the container's env, after everything the chart renders itself --
# so an override wins where one is meant to.
#
# This exists because several settings core reads live ONLY in the environment,
# with no config.yaml key. `MCP_TRUSTED_HOSTS` is the one that bites first: the
# hardening guide calls replacing its dev default MANDATORY, and until this
# value existed a chart install fronted by a Service or an Ingress answered
# `400 Invalid host header` to everything with no way to fix it through Helm.
#
# `OTEL_EXPORTER_OTLP_ENDPOINT` is the other common one: tracing is on by
# default and points at localhost:4317, so every pod logs a connection-refused
# loop until it is redirected.
#
# Standard Kubernetes EnvVar entries, so `valueFrom` works -- which is what
# anything credential-shaped needs.
extraEnv: []
  # - name: MCP_TRUSTED_HOSTS
  #   value: "mcp-hangar.hangar.svc.cluster.local,hangar.example.com"
  # - name: OTEL_EXPORTER_OTLP_ENDPOINT
  #   value: "http://otel-collector.monitoring.svc.cluster.local:4317"
  # - name: SOME_TOKEN
  #   valueFrom:
  #     secretKeyRef: {name: my-secret, key: token}

# Whole ConfigMaps/Secrets as environment, the other half of the same need.
extraEnvFrom: []
  # - secretRef: {name: hangar-extra-env}
  # - configMapRef: {name: hangar-extra-env}

# ── Pod Disruption Budget ──────────────────────────────────────────────

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1
