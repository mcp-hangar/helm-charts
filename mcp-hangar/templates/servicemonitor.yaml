{{- if and .Values.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "mcp-hangar.fullname" . }}
  labels:
    {{- include "mcp-hangar.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # Without this, Prometheus Operator names the job after the Service, which is
  # `{{ include "mcp-hangar.fullname" . }}` -- release-dependent. The shipped
  # alerts match a fixed `job="mcp-hangar"`, so they selected nothing on any
  # install whose release was not named `mcp-hangar` (#224).
  jobLabel: mcp-hangar.io/job
  selector:
    matchLabels:
      {{- include "mcp-hangar.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}
