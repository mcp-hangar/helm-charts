{{/* Validated here as well as in the ConfigMap: today the checksum annotation
     below pulls the ConfigMap in even when `configMap.create` is false, so the
     guard happens to run either way. That is incidental -- this line makes it
     deliberate, because a Deployment always renders. */}}
{{- include "mcp-hangar.validateCluster" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-hangar.fullname" . }}
  labels:
    {{- include "mcp-hangar.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mcp-hangar.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mcp-hangar.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mcp-hangar.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken | default false }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config
            - /etc/mcp-hangar/config.yaml
            - serve
            - --http
            - --host
            - "0.0.0.0"
            - --port
            - {{ .Values.config.port | quote }}
            {{- if .Values.config.unsafeNoAuth }}
            - --unsafe-no-auth
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/mcp-hangar
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
          env:
            - name: MCP_MODE
              value: {{ .Values.config.mode | quote }}
            - name: MCP_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: MCP_JSON_LOGS
              value: {{ .Values.config.jsonLogs | quote }}
            {{- $p := .Values.persistence | default dict }}
            {{- if and (eq (default "" $p.backend) "postgresql") $p.postgresql.existingSecret }}
            - name: HANGAR_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $p.postgresql.existingSecret | quote }}
                  key: {{ $p.postgresql.existingSecretKey | default "password" | quote }}
            {{- end }}
            {{- if gt (int .Values.replicaCount) 1 }}
            # A recognisable identity per pod. It is a label, not the identity:
            # a per-process suffix is always appended, so replicas rolled from
            # one ConfigMap cannot end up sharing an id.
            - name: HANGAR_INSTANCE_LABEL
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "mcp-hangar.fullname" . }}
        - name: tmp
          emptyDir: {}
        - name: data
          {{- $sqlitePv := and (eq (default "" (.Values.persistence).backend) "sqlite") .Values.persistence.sqlite.persistentVolume.enabled }}
          {{- if $sqlitePv }}
          persistentVolumeClaim:
            claimName: {{ include "mcp-hangar.fullname" . }}-data
          {{- else }}
          # An emptyDir loses the event log and the fleet on every pod restart.
          # Durable history needs persistence.sqlite.persistentVolume.enabled,
          # or postgresql.
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
