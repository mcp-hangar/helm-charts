{{- include "mcp-hangar.validateCluster" . }}
{{- if .Values.configMap.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcp-hangar.fullname" . }}
  labels:
    {{- include "mcp-hangar.labels" . | nindent 4 }}
data:
  config.yaml: |
    logging:
      level: {{ .Values.config.logLevel }}
      json_format: {{ .Values.config.jsonLogs }}
    {{- $p := .Values.persistence | default dict }}
    {{- if eq (default "" $p.backend) "sqlite" }}

    persistence:
      backend: sqlite
      sqlite:
        data_dir: {{ $p.sqlite.dataDir | quote }}
    {{- else if eq (default "" $p.backend) "postgresql" }}

    persistence:
      backend: postgresql
      postgresql:
        host: {{ $p.postgresql.host | quote }}
        port: {{ $p.postgresql.port }}
        database: {{ $p.postgresql.database | quote }}
        user: {{ $p.postgresql.user | quote }}
        {{- if $p.postgresql.existingSecret }}
        # Interpolated from the environment; the value lives in the Secret
        # named by persistence.postgresql.existingSecret, not in this ConfigMap.
        password: ${HANGAR_DB_PASSWORD}
        {{- else }}
        password: {{ $p.postgresql.password | quote }}
        {{- end }}
    {{- end }}
    {{- if .Values.coordination.enabled }}

    coordination:
      lease_ttl_s: {{ .Values.coordination.leaseTtlSeconds }}
      renew_interval_s: {{ .Values.coordination.renewIntervalSeconds }}
      renew_deadline_s: {{ .Values.coordination.renewDeadlineSeconds }}
    {{- end }}

    mcp_servers:
      {{- if .Values.mcp_servers }}
      {{- toYaml .Values.mcp_servers | nindent 6 }}
      {{- else }}
      {}
      {{- end }}
    {{- with .Values.auth }}

    auth:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
