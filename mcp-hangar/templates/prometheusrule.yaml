{{- if .Values.prometheusRule.enabled }}
{{- if not (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
{{- fail "prometheusRule.enabled is true but the Prometheus Operator CRDs (monitoring.coreos.com/v1) are not installed" }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "mcp-hangar.fullname" . }}
  {{- with .Values.prometheusRule.namespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "mcp-hangar.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
# The alert groups shipped on a cluster are OWNED by files/prometheus-alerts.yaml
# in this repo -- and since mcp-hangar/mcp-hangar#930 deleted core's monitoring/
# directory, that file is the only copy left. It is not generated from anything
# upstream. (The two used to coexist and drifted in both directions, which is
# what issue #126 was about.)
# .Files.Get inserts the content verbatim, so the Prometheus annotation
# templates ({{`{{ $value }}`}} etc.) pass through untouched. The indent below
# is load-bearing: at `indent 0` this renders `spec: null` with `groups` as a
# top-level key, which still passes kubeconform. ci-charts.yml checks the
# rendered rule count for exactly that reason.
spec:
{{ .Files.Get "files/prometheus-alerts.yaml" | indent 2 }}
{{- end }}
