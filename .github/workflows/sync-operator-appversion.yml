# Keeps the mcp-hangar-operator chart's `appVersion` tracking the latest published
# operator (mcp-hangar-operator) release. The chart deploys
# `ghcr.io/mcp-hangar/mcp-hangar-operator:<appVersion>` (`values.yaml` `tag: ""` →
# `.Chart.AppVersion`), so when appVersion lags an operator release, `helm install`
# ships the older image — the same drift that left Kubernetes/Helm users on the
# pre-CVE-2026-59950 core image after core 1.5.1 was published, which is what
# `sync-core-appversion.yml` was written to close for the mcp-hangar chart. This
# closes it for the operator chart: it reads the latest operator release, and if
# the chart is behind, opens a PR bumping appVersion. release-please then cuts the
# chart version. Pull-based (no cross-repo token needed to read a public release);
# runs daily and on demand.
#
# SIBLING: `.github/workflows/sync-core-appversion.yml` does this same job for the
# mcp-hangar chart against core releases. The two are near-identical by design —
# change one and change the other, or they drift apart silently.
name: sync-operator-appversion

on:
  schedule:
    # Daily. The org's other sync crons are 17 6 (sync-core-appversion here),
    # 23 6 (website sync-core-version) and 41 6 (docs sync-release-matrix); 53 6
    # is at least 12 minutes clear of each so the runs do not queue behind one
    # another, and it stays off :00/:30, where GitHub's scheduler is most
    # congested and delays scheduled runs the most.
    - cron: "53 6 * * *" # daily; the manual trigger covers "just released, bump now"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

env:
  # Opening the PR with the App token (not GITHUB_TOKEN) makes release-please and
  # the PR validators actually run on it. Falls back to GITHUB_TOKEN if the app
  # secret is absent (the PR still opens; downstream workflows just won't trigger).
  RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: ${{ env.RELEASE_BOT_APP_ID != '' }}
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Compare chart appVersion to the latest operator release
        id: v
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `gh api .../releases/latest`, not `gh release view`: the REST "latest"
          # endpoint is defined to exclude drafts and prereleases, whereas
          # `gh release view` reports whatever release is newest. A candidate is
          # briefly flagged Latest between the release job creating it and the flag
          # being corrected, and that window is enough for a scheduled run to open a
          # PR advertising a prerelease. AGENTS.md is explicit that appVersion
          # "tracks the last STABLE release -- never a candidate".
          rel="$(gh api repos/mcp-hangar/mcp-hangar-operator/releases/latest)"
          op="$(printf '%s' "$rel" | jq -r '.tag_name' | sed 's/^v//')"
          pre="$(printf '%s' "$rel" | jq -r '.prerelease')"
          draft="$(printf '%s' "$rel" | jq -r '.draft')"
          # Belt and braces: /releases/latest should never hand back either flag set.
          # If it somehow does, stop rather than advertise a candidate as stable.
          if [ "$pre" != "false" ] || [ "$draft" != "false" ]; then
            echo "::error::latest operator release $op is flagged prerelease=$pre draft=$draft — refusing to bump."
            exit 1
          fi
          cur="$(awk -F'"' '/^appVersion:/{print $2; exit}' mcp-hangar-operator/Chart.yaml)"
          echo "op=$op"   >> "$GITHUB_OUTPUT"
          echo "cur=$cur" >> "$GITHUB_OUTPUT"
          # Only bump forward: behind = op is strictly newer than cur (SemVer).
          if [ "$op" != "$cur" ] && [ "$(printf '%s\n%s\n' "$cur" "$op" | sort -V | tail -1)" = "$op" ]; then
            echo "behind=true" >> "$GITHUB_OUTPUT"
            echo "::notice::mcp-hangar-operator chart appVersion $cur is behind operator release $op — opening a bump PR."
          else
            echo "behind=false" >> "$GITHUB_OUTPUT"
            echo "::notice::mcp-hangar-operator chart appVersion $cur is current with operator $op — nothing to do."
          fi

      - name: Bump appVersion
        if: steps.v.outputs.behind == 'true'
        run: |
          set -euo pipefail
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.v.outputs.op }}\"/" mcp-hangar-operator/Chart.yaml
          grep -n '^appVersion:' mcp-hangar-operator/Chart.yaml

      - name: Open PR
        if: steps.v.outputs.behind == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          branch: chore/sync-operator-appversion
          delete-branch: true
          commit-message: "fix(operator): default the mcp-hangar-operator chart to operator image ${{ steps.v.outputs.op }}"
          title: "fix(operator): default the mcp-hangar-operator chart to operator image ${{ steps.v.outputs.op }}"
          body: |
            Automated by `sync-operator-appversion` — the `mcp-hangar-operator` chart's `appVersion` lagged the latest published operator release.

            ## Why

            The chart deploys `ghcr.io/mcp-hangar/mcp-hangar-operator:<appVersion>` (`values.yaml` `tag: ""` → `.Chart.AppVersion`). The operator released **${{ steps.v.outputs.op }}** but the chart still defaulted to **${{ steps.v.outputs.cur }}**, so `helm install` shipped the older image — a published operator fix that never reached Helm users. This is the same drift that left Kubernetes/Helm users on the pre-CVE-2026-59950 core image after core 1.5.1 was published, which `sync-core-appversion` closed for the `mcp-hangar` chart. release-please cuts the chart version on merge.

            ## How tested

            appVersion-only bump to an already-published stable operator release (`/releases/latest`, so never a candidate); `ci-charts` render/install applies on this PR.
