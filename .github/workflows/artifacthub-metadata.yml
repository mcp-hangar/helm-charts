# Pushes each chart's artifacthub-repo.yml to its GHCR OCI repo under the
# special `artifacthub.io` tag, which is how Artifact Hub links an OCI repo
# to its listing and grants the "Verified publisher" badge. Runs when the
# metadata changes and on manual dispatch; the push is idempotent (same
# content -> same digest), so re-runs are harmless. The `artifacthub.io`
# tag is metadata-only -- it never touches chart version tags, so ADR-004
# digest pinning is unaffected.
name: artifacthub-metadata

on:
  push:
    branches: [main]
    paths:
      - 'artifacthub/**'
      - '.github/workflows/artifacthub-metadata.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  ORAS_VERSION: "1.3.3"
  ORAS_SHA256: "9ce999f8d2de03fc03968b29d743077a58783e545e5eaa53917ca177352d0e59"

jobs:
  push-metadata:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: [mcp-hangar, mcp-hangar-operator]
    steps:
      - uses: actions/checkout@v7

      - name: Install oras (pinned)
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" -o /tmp/oras.tgz
          echo "${ORAS_SHA256}  /tmp/oras.tgz" | sha256sum -c -
          tar xzf /tmp/oras.tgz -C /usr/local/bin oras

      - name: Push artifacthub-repo.yml
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd "artifacthub/${{ matrix.chart }}"
          oras push "ghcr.io/mcp-hangar/charts/${{ matrix.chart }}:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
