# Why this exists: this repo had zero chart CI -- no `helm lint`, no
# `helm template`, no install test. Three charts shipped in states that
# could not actually be installed (see #25, #26, #27, #30, #31, #32, #33,
# #34), each found by hand during a live test campaign. Rendering cleanly
# is not the same as installing and working: a config key the image
# rejects, a CLI flag the image doesn't accept, CRDs that don't match what
# the image watches, or a `--wait` that hangs on the default replica count
# all produce charts that lint and template fine and then crashloop or
# hang for a real user. This workflow asserts INSTALL, not just render.
#
# Helm 3 AND Helm 4 (#149): users legitimately run either major, and the two
# differ where these charts care -- Helm 4 fresh installs default to
# server-side apply (SSA), `--wait` judges real readiness (kstatus, not the
# Helm 3 pod-status heuristic), and SSA turns silent field overwrites into
# explicit conflicts on the templated CRDs. So every gate below runs under
# both majors, plus a cross lane for the path users actually live in:
# installed by 3, upgraded by 4.
name: ci-charts

on:
  # Deliberately NOT path-filtered: this workflow is meant to be a required
  # status check (see the `charts-required` job below), and a path-filtered
  # required check deadlocks every PR that doesn't touch a matching path --
  # GitHub blocks the merge waiting on a check run that GitHub itself never
  # schedules. Every PR triggers the workflow; the `detect` job decides
  # internally whether the heavy jobs need to actually do anything.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'mcp-hangar/**'
      - 'mcp-hangar-operator/**'
      - '.github/workflows/ci-charts.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: v0.8.0
  # Deliberate choices, not moving defaults: KUBERNETES_VERSION,
  # KIND_VERSION and KIND_NODE_IMAGE must stay in sync (the node image and
  # kubeconform's schema version both come from the same k8s release).
  KUBERNETES_VERSION: "1.32.8"
  KIND_VERSION: v0.30.0
  KIND_NODE_IMAGE: kindest/node:v1.32.8@sha256:abd489f042d2b644e2d033f5c2d900bc707798d075e8186cb65e3f1367a9d5a1
  # promtool ships inside the Prometheus release tarball. Pinned like the rest:
  # the rules it validates change rarely, and a moving `latest` would turn this
  # gate red on somebody else's release day.
  PROMETHEUS_VERSION: v3.13.2
  # The supported Helm matrix (#149): latest patch of each major at time of
  # pinning, bumped deliberately by PR, never resolved at runtime -- before
  # these pins `azure/setup-helm` floated on "latest" and the repo's CI could
  # switch Helm majors on the action's schedule with zero assertion of either.
  # The SHA256s pin the direct tarball downloads (get.helm.sh) in jobs that
  # need both binaries at once, where setup-helm can only install one.
  # release.yml carries its own HELM4_VERSION copy -- keep them in step.
  HELM3_VERSION: v3.21.4
  HELM3_SHA256: 61f88ab166748cb19604d7884cb100ae9ccb13804ddeb98e08af167eacbb6a14
  HELM4_VERSION: v4.2.4
  HELM4_SHA256: c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3

jobs:
  # Runs on every PR (see the un-filtered `on:` above) and decides whether
  # the heavy jobs below need to do anything. A chart-touching PR gets the
  # full run; a docs-only PR skips straight to a green `charts-required`.
  detect:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            run:
              - 'mcp-hangar/**'
              - 'mcp-hangar-operator/**'
              - '.github/workflows/ci-charts.yml'

  # Helm 4 removed the atomic flag (use rollback-on-failure), the standalone
  # force flag (split into force-replace/force-conflicts) and path-style
  # post-renderers. This repo uses none of them (verified at the time of
  # #149); this gate keeps it that way so the next major's flag removals stay
  # a non-event. Runs on every PR -- it's grep, not a cluster. The flags are
  # deliberately NOT spelled with their dashes anywhere in this job, comments
  # included: the gate greps this file too.
  flag-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Helm-4-removed flags stay out of workflows and READMEs
        run: |
          set -euo pipefail
          # The banned patterns are assembled from pieces so this file's own
          # gate doesn't match itself. `-e` because the pattern starts with
          # `--`, which grep would otherwise parse as an option.
          d='--'
          pat="${d}atomic|${d}force([^-a-zA-Z]|\$)|${d}post-renderer[= ][^ ]*/"
          # rc=1 (no matches) is the pass; rc=2 (e.g. a listed file missing)
          # must fail the gate rather than read as "clean".
          rc=0
          grep -rnE -e "$pat" .github/workflows/ README.md mcp-hangar/README.md mcp-hangar-operator/README.md || rc=$?
          if [ "$rc" = "0" ]; then
            echo "::error::a Helm-4-removed flag appears above (banned: atomic, standalone force, path-style post-renderer)"
            exit 1
          elif [ "$rc" != "1" ]; then
            echo "::error::grep failed (rc=${rc}) -- gate cannot conclude anything"
            exit 1
          fi
          echo "no Helm-4-removed flags found"

  # Fast: no cluster. Catches template/schema-level defects (bad YAML,
  # invalid fields, wrong apiVersions) in seconds, per chart -- under BOTH
  # supported Helm majors, so a template that only one major accepts (or a
  # deprecation only one major warns about) is a red build, not a user report.
  lint-and-render:
    needs: detect
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: [mcp-hangar, mcp-hangar-operator]
        helm: [v3, v4]
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: ${{ matrix.helm == 'v3' && env.HELM3_VERSION || env.HELM4_VERSION }}

      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform

      - name: helm lint
        run: helm lint "${{ matrix.chart }}"

      - name: helm template (default values) | kubeconform
        run: |
          set -euo pipefail
          helm template t "${{ matrix.chart }}" \
            | kubeconform -strict -ignore-missing-schemas -kubernetes-version "$KUBERNETES_VERSION" -summary -

      - name: helm template (ci-values.yaml) | kubeconform
        if: hashFiles(format('{0}/ci-values.yaml', matrix.chart)) != ''
        run: |
          set -euo pipefail
          helm template t "${{ matrix.chart }}" -f "${{ matrix.chart }}/ci-values.yaml" \
            | kubeconform -strict -ignore-missing-schemas -kubernetes-version "$KUBERNETES_VERSION" -summary -

      # Render-only, and separate from ci-values.yaml on purpose: that file is
      # also installed on kind, and a real replica set needs a shared database
      # this workflow does not stand up. Rendering still proves the chart can
      # express a supported cluster -- and the guards fail the render when any
      # part of the shape is missing, so this step going green is the assertion.
      - name: helm template (ci-cluster-values.yaml) | kubeconform
        if: hashFiles(format('{0}/ci-cluster-values.yaml', matrix.chart)) != ''
        run: |
          set -euo pipefail
          helm template t "${{ matrix.chart }}" -f "${{ matrix.chart }}/ci-cluster-values.yaml" \
            | kubeconform -strict -ignore-missing-schemas -kubernetes-version "$KUBERNETES_VERSION" -summary -

      # `helm lint` and `kubeconform` both stop at the shape of the object. The
      # alert rules inside it are one opaque string to them: a typo in a PromQL
      # expression renders fine, applies fine, and is then refused by Prometheus
      # at rule-load time -- on the user's cluster, not here.
      #
      # Validates the RENDERED `spec`, not `files/prometheus-alerts.yaml`
      # directly, because the template inserts that file with
      # `{{ .Files.Get ... | indent 2 }}` and the indent is load-bearing: at
      # `indent 0` the rendered object comes out with `spec: null` and `groups`
      # promoted to a top-level key. It still renders, and kubeconform still
      # passes it.
      #
      # Hence the count check. `promtool check rules` answers "SUCCESS: 0 rules
      # found" for an empty file, so promtool alone would go green on exactly
      # that breakage -- a gate that validates nothing and says so cheerfully.
      # Comparing the rendered count against the source file is what turns this
      # into an assertion.
      - name: promtool check rules (rendered PrometheusRule)
        if: hashFiles(format('{0}/files/prometheus-alerts.yaml', matrix.chart)) != ''
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/prometheus/prometheus/releases/download/${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION#v}.linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin --strip-components=1 "prometheus-${PROMETHEUS_VERSION#v}.linux-amd64/promtool"
          # --api-versions: the template fails hard when the Prometheus Operator
          # CRDs are absent, which is correct behaviour and would otherwise make
          # this step impossible without a cluster.
          helm template t "${{ matrix.chart }}" \
            --set prometheusRule.enabled=true \
            --api-versions monitoring.coreos.com/v1 \
            > /tmp/rendered.yaml
          python3 - "${{ matrix.chart }}/files/prometheus-alerts.yaml" <<'EOF' > /tmp/rules.yaml
          import sys, yaml

          def count(spec):
              return sum(len(g.get("rules") or []) for g in (spec.get("groups") or []))

          docs = [d for d in yaml.safe_load_all(open("/tmp/rendered.yaml")) if d]
          found = [d for d in docs if d.get("kind") == "PrometheusRule"]
          if len(found) != 1:
              sys.exit(f"::error::expected exactly one PrometheusRule, rendered {len(found)}")
          spec = found[0].get("spec")
          if not spec:
              sys.exit("::error::the rendered PrometheusRule has an empty spec -- check the indent in templates/prometheusrule.yaml")
          expected = count(yaml.safe_load(open(sys.argv[1])))
          if count(spec) != expected:
              sys.exit(f"::error::rendered {count(spec)} rules, the source file has {expected}")
          yaml.safe_dump(spec, sys.stdout, default_flow_style=False)
          EOF
          promtool check rules /tmp/rules.yaml

  # There should be zero template-level divergence between the majors --
  # assert it, don't assume it. If Helm 4 ever renders differently we want a
  # red build here, not a surprised user.
  template-parity:
    needs: detect
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: [mcp-hangar, mcp-hangar-operator]
    steps:
      - uses: actions/checkout@v7

      # `azure/setup-helm` can only install one Helm; this job needs both, so
      # it fetches the tarballs directly -- pinned by URL + checksum, same as
      # kubeconform/promtool. The installed binaries are thin wrappers that
      # tee stderr to /tmp/helm-stderr.log so lanes can later assert "no
      # deprecation warnings" without instrumenting every call site.
      - name: Install pinned helm3 + helm4
        run: |
          set -euo pipefail
          for spec in "helm3 ${HELM3_VERSION} ${HELM3_SHA256}" "helm4 ${HELM4_VERSION} ${HELM4_SHA256}"; do
            read -r name ver sha <<< "$spec"
            curl -sSL "https://get.helm.sh/helm-${ver}-linux-amd64.tar.gz" -o "/tmp/${name}.tgz"
            echo "${sha}  /tmp/${name}.tgz" | sha256sum -c -
            mkdir -p "/tmp/${name}" && tar xzf "/tmp/${name}.tgz" -C "/tmp/${name}" --strip-components=1
            sudo install "/tmp/${name}/helm" "/usr/local/bin/${name}.real"
            printf '#!/usr/bin/env bash\nexec "/usr/local/bin/%s.real" "$@" 2> >(tee -a /tmp/helm-stderr.log >&2)\n' "$name" \
              | sudo tee "/usr/local/bin/${name}" > /dev/null
            sudo chmod +x "/usr/local/bin/${name}"
          done
          helm3 version
          helm4 version

      # Not byte-identical, deliberately: Helm 4 inserts a blank line before
      # each `---` document separator and emits the documents in a different
      # order than Helm 3 (both observed on v3.21.4 vs v4.2.4, #150). Both are
      # formatting, so the assertion is object-level identity: parse both
      # renders, sort documents by kind/name, and compare. Any semantic
      # drift -- a field, a value, a document present under one major only --
      # is still a red build here.
      - name: helm template output identical across majors (object-level)
        run: |
          set -euo pipefail
          chart="${{ matrix.chart }}"
          normalize() {
            python3 - "$1" <<'EOF'
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d is not None]
          docs.sort(key=lambda d: (d.get("kind", ""), ((d.get("metadata") or {}).get("name", ""))))
          yaml.safe_dump_all(docs, sys.stdout, default_flow_style=False, sort_keys=True)
          EOF
          }
          for vf in "" ci-values.yaml ci-cluster-values.yaml; do
            args=()
            if [ -n "$vf" ]; then
              [ -f "${chart}/${vf}" ] || continue
              args=(-f "${chart}/${vf}")
            fi
            helm3 template t "$chart" "${args[@]}" > /tmp/render-v3.yaml
            helm4 template t "$chart" "${args[@]}" > /tmp/render-v4.yaml
            normalize /tmp/render-v3.yaml > /tmp/norm-v3.yaml
            normalize /tmp/render-v4.yaml > /tmp/norm-v4.yaml
            if ! diff -u /tmp/norm-v3.yaml /tmp/norm-v4.yaml > /tmp/render.diff; then
              echo "::error::helm3 vs helm4 render drift for ${chart} (${vf:-default values})"
              head -100 /tmp/render.diff
              exit 1
            fi
            echo "identical: ${chart} (${vf:-default values})"
          done

      # Guard the flag against rot: crds.install=false must mean zero CRD
      # documents, under both majors.
      - name: crds.install=false renders zero CRDs under both majors
        if: matrix.chart == 'mcp-hangar-operator'
        run: |
          set -euo pipefail
          for h in helm3 helm4; do
            n="$("$h" template t mcp-hangar-operator --set crds.install=false | grep -c '^kind: CustomResourceDefinition' || true)"
            if [ "$n" != "0" ]; then
              echo "::error::${h}: crds.install=false still rendered ${n} CRD document(s)"
              exit 1
            fi
            echo "${h}: zero CRD documents with crds.install=false"
          done

  # The crux: install each chart against its pinned appVersion image on a
  # real cluster and assert it actually works, not just that it renders.
  # Two lanes: h3 (full lifecycle under Helm 3 -- asserts we didn't quietly
  # become Helm-4-only) and h4 (full lifecycle under Helm 4 -- fresh install
  # means SSA by default, and every --wait below is kstatus-gated real
  # readiness rather than the Helm 3 pod-status heuristic). The cross-version
  # path lives in the separate cross-upgrade job.
  install-smoke:
    needs: [detect, lint-and-render]
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [h3, h4]
    env:
      HELM: ${{ matrix.lane == 'h3' && 'helm3' || 'helm4' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned helm3 + helm4
        run: |
          set -euo pipefail
          for spec in "helm3 ${HELM3_VERSION} ${HELM3_SHA256}" "helm4 ${HELM4_VERSION} ${HELM4_SHA256}"; do
            read -r name ver sha <<< "$spec"
            curl -sSL "https://get.helm.sh/helm-${ver}-linux-amd64.tar.gz" -o "/tmp/${name}.tgz"
            echo "${sha}  /tmp/${name}.tgz" | sha256sum -c -
            mkdir -p "/tmp/${name}" && tar xzf "/tmp/${name}.tgz" -C "/tmp/${name}" --strip-components=1
            sudo install "/tmp/${name}/helm" "/usr/local/bin/${name}.real"
            printf '#!/usr/bin/env bash\nexec "/usr/local/bin/%s.real" "$@" 2> >(tee -a /tmp/helm-stderr.log >&2)\n' "$name" \
              | sudo tee "/usr/local/bin/${name}" > /dev/null
            sudo chmod +x "/usr/local/bin/${name}"
          done
          helm3 version
          helm4 version

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: ${{ env.KIND_VERSION }}
          node_image: ${{ env.KIND_NODE_IMAGE }}
          cluster_name: chart-ci
          wait: 90s

      # ── core (mcp-hangar) ────────────────────────────────────────────
      # unsafeNoAuth: the 1.5 server refuses to bind non-loopback without
      # auth configured. That's intended behavior; the flag is the
      # documented demo path, and what we use here to exercise the rest
      # of the install without also standing up an OIDC provider.
      - name: Install core (mcp-hangar)
        id: install_core
        continue-on-error: true
        run: |
          set -euo pipefail

          # Re-port-forwards and polls /health/ready; called after install,
          # upgrade and rollback so those three checks don't triplicate the
          # same block.
          wait_for_core_ready() {
            local label="$1"
            kubectl -n core port-forward svc/core-mcp-hangar 18080:8080 >/tmp/core-pf.log 2>&1 &
            local pf_pid=$!

            local code="" ready=false
            for _ in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/health/ready || true)
              if [ "$code" = "200" ]; then
                ready=true
                break
              fi
              sleep 1
            done

            kill "$pf_pid" 2>/dev/null || true

            if [ "$ready" != "true" ]; then
              echo "::error::GET /health/ready (${label}) did not return 200 (last code: ${code:-<none>})"
              cat /tmp/core-pf.log || true
              return 1
            fi
            echo "GET /health/ready (${label}) -> 200"
          }

          echo "::group::${HELM} install core"
          "$HELM" install core ./mcp-hangar -n core --create-namespace --wait --timeout 300s \
            --set config.unsafeNoAuth=true
          echo "::endgroup::"

          echo "::group::pod readiness"
          kubectl -n core get pods -o wide
          kubectl -n core wait --for=condition=Ready pod \
            -l app.kubernetes.io/name=mcp-hangar,app.kubernetes.io/instance=core \
            --timeout=60s
          echo "::endgroup::"

          echo "::group::GET /health/ready"
          wait_for_core_ready "initial install"
          echo "::endgroup::"

          # No --logs: the test pod carries hook-delete-policy: hook-succeeded,
          # and Helm 3 deletes it before fetching logs -- `helm3 test --logs`
          # exits 1 with "pods not found" on a PASSING test (observed on
          # v3.21.4; Helm 4 prints the logs first). The logs of a green
          # wget --spider are empty anyway; on failure the pod survives and
          # the diagnostics step has it.
          echo "::group::${HELM} test core"
          "$HELM" test core -n core
          echo "::endgroup::"

          # Upgrade + rollback (#7). This used to bump replicaCount to 2,
          # justified by "core has no leader-election" -- true when it was
          # written and false since 2.5.0. Two replicas without shared storage
          # are two gateways, each with its own fleet, which is the exact shape
          # the chart now refuses at render time; the refusal turned this step
          # red, which is the guard working rather than a regression.
          #
          # A log-level change is the replacement: it rewrites the ConfigMap,
          # so the checksum annotation moves and a genuine rollout happens for
          # --wait to gate on -- without asking for a configuration that cannot
          # be safe here. The multi-replica shape is covered by rendering
          # ci-cluster-values.yaml, which is as far as it goes without a
          # PostgreSQL this job does not stand up.
          echo "::group::${HELM} upgrade core (log level change, forces a rollout)"
          "$HELM" upgrade core ./mcp-hangar -n core --reuse-values --wait --timeout 300s \
            --set config.logLevel=DEBUG
          echo "::endgroup::"

          echo "::group::GET /health/ready (post-upgrade)"
          wait_for_core_ready "post-upgrade"
          echo "::endgroup::"

          echo "::group::${HELM} rollback core to revision 1"
          "$HELM" rollback core 1 -n core --wait --timeout 300s
          echo "::endgroup::"

          echo "::group::GET /health/ready (post-rollback)"
          wait_for_core_ready "post-rollback"
          echo "::endgroup::"

      - name: Diagnostics (core) on failure
        if: steps.install_core.outcome == 'failure'
        run: |
          echo "---- pods ----"
          kubectl -n core get pods -o wide || true
          echo "---- describe pods ----"
          kubectl -n core describe pods || true
          echo "---- events ----"
          kubectl -n core get events --sort-by=.lastTimestamp || true
          echo "---- logs ----"
          kubectl -n core logs -l app.kubernetes.io/name=mcp-hangar --all-containers --tail=300 || true
          echo "---- port-forward log ----"
          cat /tmp/core-pf.log || true

      # ── operator (mcp-hangar-operator) ───────────────────────────────
      # Default values (webhooks off) -- no cert-manager in this cluster.
      - name: Install operator (mcp-hangar-operator)
        id: install_operator
        continue-on-error: true
        run: |
          set -euo pipefail

          echo "::group::${HELM} install operator"
          "$HELM" install op ./mcp-hangar-operator -n op --create-namespace --wait --timeout 300s
          echo "::endgroup::"

          echo "::group::operator pod readiness"
          kubectl -n op get pods -o wide
          kubectl -n op wait --for=condition=Ready pod \
            -l app.kubernetes.io/name=mcp-hangar-operator,app.kubernetes.io/instance=op \
            --timeout=60s
          echo "::endgroup::"

          echo "::group::CRDs Established"
          kubectl wait --for=condition=Established --timeout=60s \
            crd/mcpservers.mcp-hangar.io \
            crd/mcpservergroups.mcp-hangar.io \
            crd/mcpdiscoverysources.mcp-hangar.io
          echo "::endgroup::"

          echo "::group::apply MCPServer sample and wait for reconcile"
          # A one-line JSON doc via a here-string, not a heredoc: a heredoc
          # terminator must sit at column 0 to match, which would end the
          # enclosing YAML `run: |` block scalar early (YAML block scalars
          # end at the first less-indented line) and break this workflow
          # file. JSON is valid YAML, so kubectl's decoder accepts it as-is.
          # Image is deliberately unpullable -- we assert the operator
          # reconciled (status populated, child Pod created with an
          # ownerReference back to us), not that the image pulls;
          # ImagePullBackOff on the child Pod here is expected and fine.
          kubectl -n op apply -f - <<< '{"apiVersion":"mcp-hangar.io/v1alpha2","kind":"MCPServer","metadata":{"name":"ci-smoke"},"spec":{"mode":"container","image":"ghcr.io/mcp-hangar/does-not-exist:ci-smoke-test"}}'

          pod_name=""
          deadline=$((SECONDS + 90))
          while [ "$SECONDS" -lt "$deadline" ]; do
            pod_name="$(kubectl -n op get mcpserver ci-smoke -o jsonpath='{.status.podName}' 2>/dev/null || true)"
            if [ -n "$pod_name" ]; then
              break
            fi
            sleep 3
          done

          if [ -z "$pod_name" ]; then
            echo "::error::operator never set status.podName on MCPServer/ci-smoke within 90s"
            kubectl -n op get mcpserver ci-smoke -o yaml || true
            exit 1
          fi
          echo "status.podName = $pod_name"

          owner="$(kubectl -n op get pod "$pod_name" -o jsonpath='{.metadata.ownerReferences[?(@.kind=="MCPServer")].name}' 2>/dev/null || true)"
          if [ "$owner" != "ci-smoke" ]; then
            echo "::error::child Pod $pod_name has no ownerReference back to MCPServer/ci-smoke (got: '${owner:-<none>}')"
            kubectl -n op get pod "$pod_name" -o yaml || true
            exit 1
          fi
          echo "child Pod $pod_name has ownerReference -> MCPServer/ci-smoke (reconcile confirmed)"
          echo "::endgroup::"

          # Upgrade + rollback (#7): deliberately NOT replicaCount>1. The
          # operator's /readyz is leader-gated -- only the elected leader
          # reports ready -- so `helm upgrade --wait` at 2 replicas waits
          # for a standby to become Ready, which never happens, and hangs
          # (issue #26). A benign podAnnotations change exercises the
          # upgrade/rollback path itself without re-triggering that hang.
          echo "::group::${HELM} upgrade operator (benign podAnnotations change)"
          "$HELM" upgrade op ./mcp-hangar-operator -n op --reuse-values --wait --timeout 300s \
            --set-string podAnnotations.ci-upgrade-test=1
          echo "::endgroup::"

          echo "::group::operator Deployment Available (post-upgrade)"
          kubectl -n op wait --for=condition=Available deployment/op-mcp-hangar-operator --timeout=60s
          echo "::endgroup::"

          echo "::group::${HELM} rollback operator to revision 1"
          "$HELM" rollback op 1 -n op --wait --timeout 300s
          echo "::endgroup::"

          echo "::group::operator Deployment Available (post-rollback)"
          kubectl -n op wait --for=condition=Available deployment/op-mcp-hangar-operator --timeout=60s
          echo "::endgroup::"

      - name: Diagnostics (operator) on failure
        if: steps.install_operator.outcome == 'failure'
        run: |
          echo "---- pods ----"
          kubectl -n op get pods -o wide || true
          echo "---- describe pods ----"
          kubectl -n op describe pods || true
          echo "---- crds ----"
          kubectl get crds | grep mcp-hangar.io || true
          echo "---- MCPServer ----"
          kubectl -n op get mcpserver ci-smoke -o yaml || true
          echo "---- events ----"
          kubectl -n op get events --sort-by=.lastTimestamp || true
          echo "---- operator logs ----"
          kubectl -n op logs -l app.kubernetes.io/name=mcp-hangar-operator --all-containers --tail=300 || true

      # WS-3 of #149: the one genuinely new Helm 4 failure mode for these
      # charts. The CRDs ship as templates and go through the normal apply
      # path, so an out-of-band `kubectl apply --server-side` creates a
      # competing field manager on a helm-owned field. This step seeds exactly
      # that (a foreign value on the helm-owned `helm.sh/chart` label of the
      # mcpservers CRD) and then upgrades. First run records the observed
      # behavior -- conflict error vs clean takeover -- in the log; the
      # assertion is tightened to the observed truth before merge, and WS-4
      # documents that truth verbatim.
      - name: CRD field-manager conflict under SSA (h4 lane only)
        id: crd_conflict
        if: matrix.lane == 'h4' && steps.install_operator.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail

          crd_label() {
            kubectl get crd mcpservers.mcp-hangar.io -o jsonpath='{.metadata.labels.helm\.sh/chart}'
          }

          # Observed on v4.2.4 (first CI run of #150): because the h4 install
          # went in with SSA, helm owns the label via an Apply operation, and a
          # plain out-of-band SSA write is REFUSED by the apiserver with
          # 'conflict with "helm": .metadata.labels.helm.sh/chart'. Under a
          # Helm-3-created release there is no Apply owner and the same write
          # sails through silently. Assert the refusal -- it's the protection
          # Helm 4 buys users.
          echo "::group::plain out-of-band SSA write is refused (conflict with helm)"
          rc=0
          out="$(kubectl apply --server-side --field-manager=someone-else -f - <<< '{"apiVersion":"apiextensions.k8s.io/v1","kind":"CustomResourceDefinition","metadata":{"name":"mcpservers.mcp-hangar.io","labels":{"helm.sh/chart":"someone-else-owns-this"}}}' 2>&1)" || rc=$?
          echo "$out"
          if [ "$rc" = "0" ]; then
            echo "::error::expected the plain SSA write on a helm-owned field to be refused with a conflict; it succeeded"
            exit 1
          fi
          grep -q 'conflict with "helm"' <<< "$out" || {
            echo "::error::the SSA write failed, but not with the expected field-manager conflict"
            exit 1
          }
          echo "::endgroup::"

          # A determined out-of-band writer forces the conflict and takes the
          # field; then helm upgrades.
          echo "::group::seed the competing manager with --force-conflicts, then helm4 upgrade"
          kubectl apply --server-side --force-conflicts --field-manager=someone-else -f - <<< '{"apiVersion":"apiextensions.k8s.io/v1","kind":"CustomResourceDefinition","metadata":{"name":"mcpservers.mcp-hangar.io","labels":{"helm.sh/chart":"someone-else-owns-this"}}}'
          echo "label after seed: $(crd_label)"
          rc=0
          out="$(helm4 upgrade op ./mcp-hangar-operator -n op --reuse-values --wait --timeout 300s \
            --set-string podAnnotations.ci-conflict-probe=1 2>&1)" || rc=$?
          echo "$out"
          echo "::endgroup::"

          echo "OBSERVED: helm4 upgrade exit=${rc}; post-upgrade helm.sh/chart label=$(crd_label)"

      - name: No deprecation warnings from helm4 (h4 lane only)
        if: matrix.lane == 'h4'
        run: |
          touch /tmp/helm-stderr.log
          if grep -in deprecat /tmp/helm-stderr.log; then
            echo "::error::helm4 emitted deprecation warnings on our invocations (lines above)"
            exit 1
          fi
          echo "helm4 stderr clean of deprecation warnings"

      - name: Gate on install-smoke results
        if: always()
        run: |
          status=0
          for pair in "core:${{ steps.install_core.outcome }}" "operator:${{ steps.install_operator.outcome }}"; do
            name="${pair%%:*}"
            outcome="${pair##*:}"
            echo "${name}: ${outcome}"
            if [ "$outcome" != "success" ]; then
              status=1
            fi
          done
          # h3 lane skips the probe; only an actual failure is a failure.
          echo "crd-conflict: ${{ steps.crd_conflict.outcome }}"
          if [ "${{ steps.crd_conflict.outcome }}" = "failure" ]; then
            status=1
          fi
          exit "$status"

  # The lane users actually live in: a release created by Helm 3, upgraded by
  # Helm 4. Per Helm 4's documented behavior the release latches to
  # client-side apply until `--server-side` opts in -- asserted here via the
  # field managers on a chart-owned Deployment, then the SSA migration and a
  # rollback on top of it.
  cross-upgrade:
    needs: [detect, lint-and-render]
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned helm3 + helm4
        run: |
          set -euo pipefail
          for spec in "helm3 ${HELM3_VERSION} ${HELM3_SHA256}" "helm4 ${HELM4_VERSION} ${HELM4_SHA256}"; do
            read -r name ver sha <<< "$spec"
            curl -sSL "https://get.helm.sh/helm-${ver}-linux-amd64.tar.gz" -o "/tmp/${name}.tgz"
            echo "${sha}  /tmp/${name}.tgz" | sha256sum -c -
            mkdir -p "/tmp/${name}" && tar xzf "/tmp/${name}.tgz" -C "/tmp/${name}" --strip-components=1
            sudo install "/tmp/${name}/helm" "/usr/local/bin/${name}.real"
            printf '#!/usr/bin/env bash\nexec "/usr/local/bin/%s.real" "$@" 2> >(tee -a /tmp/helm-stderr.log >&2)\n' "$name" \
              | sudo tee "/usr/local/bin/${name}" > /dev/null
            sudo chmod +x "/usr/local/bin/${name}"
          done
          helm3 version
          helm4 version

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: ${{ env.KIND_VERSION }}
          node_image: ${{ env.KIND_NODE_IMAGE }}
          cluster_name: chart-ci-cross
          wait: 90s

      - name: Cross-version lifecycle (core)
        id: cross_core
        continue-on-error: true
        run: |
          set -euo pipefail

          wait_for_core_ready() {
            local label="$1"
            kubectl -n core port-forward svc/core-mcp-hangar 18080:8080 >/tmp/core-pf.log 2>&1 &
            local pf_pid=$!

            local code="" ready=false
            for _ in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/health/ready || true)
              if [ "$code" = "200" ]; then
                ready=true
                break
              fi
              sleep 1
            done

            kill "$pf_pid" 2>/dev/null || true

            if [ "$ready" != "true" ]; then
              echo "::error::GET /health/ready (${label}) did not return 200 (last code: ${code:-<none>})"
              cat /tmp/core-pf.log || true
              return 1
            fi
            echo "GET /health/ready (${label}) -> 200"
          }

          # Prints manager/operation pairs for a Deployment; the assertions
          # below grep these. CSA shows up as helm/Update, SSA as helm/Apply.
          deploy_managers() {
            kubectl -n "$1" get deploy "$2" \
              -o jsonpath='{range .metadata.managedFields[*]}{.manager}{"/"}{.operation}{"\n"}{end}'
          }

          echo "::group::helm3 install core"
          helm3 install core ./mcp-hangar -n core --create-namespace --wait --timeout 300s \
            --set config.unsafeNoAuth=true
          wait_for_core_ready "helm3 install"
          echo "::endgroup::"

          echo "::group::helm4 upgrade core (must latch to client-side apply)"
          helm4 upgrade core ./mcp-hangar -n core --reuse-values --wait --timeout 300s \
            --set config.logLevel=DEBUG
          wait_for_core_ready "helm4 CSA upgrade"
          managers="$(deploy_managers core core-mcp-hangar)"
          echo "$managers"
          if grep -q '^helm/Apply$' <<< "$managers"; then
            echo "::error::helm4 upgraded a helm3 release with SSA before --server-side opted in -- the CSA latch did not hold"
            exit 1
          fi
          grep -q '^helm/Update$' <<< "$managers" || {
            echo "::error::expected a helm/Update (CSA) field manager after the helm4 upgrade of a helm3 release"
            exit 1
          }
          echo "CSA latch held: helm/Update present, no helm/Apply"
          echo "::endgroup::"

          echo "::group::helm4 upgrade core --server-side (the migration step)"
          helm4 upgrade core ./mcp-hangar -n core --reuse-values --server-side=true --wait --timeout 300s \
            --set-string podAnnotations.ci-ssa-migration=1
          wait_for_core_ready "helm4 --server-side upgrade"
          managers="$(deploy_managers core core-mcp-hangar)"
          echo "$managers"
          grep -q '^helm/Apply$' <<< "$managers" || {
            echo "::error::expected a helm/Apply (SSA) field manager after the --server-side migration"
            exit 1
          }
          echo "SSA migration took: helm/Apply present"
          echo "::endgroup::"

          echo "::group::helm4 rollback core to revision 2"
          helm4 rollback core 2 -n core --wait --timeout 300s
          wait_for_core_ready "helm4 rollback"
          echo "::endgroup::"

          echo "::group::release history sane"
          helm4 history core -n core
          helm4 history core -n core -o json \
            | jq -e 'length == 4 and (.[-1].status == "deployed")' > /dev/null || {
            echo "::error::expected 4 revisions with the last one deployed"
            exit 1
          }
          echo "::endgroup::"

      - name: Diagnostics (core) on failure
        if: steps.cross_core.outcome == 'failure'
        run: |
          echo "---- pods ----"
          kubectl -n core get pods -o wide || true
          echo "---- describe pods ----"
          kubectl -n core describe pods || true
          echo "---- events ----"
          kubectl -n core get events --sort-by=.lastTimestamp || true
          echo "---- logs ----"
          kubectl -n core logs -l app.kubernetes.io/name=mcp-hangar --all-containers --tail=300 || true
          echo "---- history ----"
          helm4 history core -n core || true

      - name: Cross-version lifecycle (operator)
        id: cross_operator
        continue-on-error: true
        run: |
          set -euo pipefail

          deploy_managers() {
            kubectl -n "$1" get deploy "$2" \
              -o jsonpath='{range .metadata.managedFields[*]}{.manager}{"/"}{.operation}{"\n"}{end}'
          }

          echo "::group::helm3 install operator"
          helm3 install op ./mcp-hangar-operator -n op --create-namespace --wait --timeout 300s
          kubectl -n op wait --for=condition=Available deployment/op-mcp-hangar-operator --timeout=60s
          echo "::endgroup::"

          echo "::group::helm4 upgrade operator (must latch to client-side apply)"
          helm4 upgrade op ./mcp-hangar-operator -n op --reuse-values --wait --timeout 300s \
            --set-string podAnnotations.ci-cross-a=1
          managers="$(deploy_managers op op-mcp-hangar-operator)"
          echo "$managers"
          if grep -q '^helm/Apply$' <<< "$managers"; then
            echo "::error::helm4 upgraded a helm3 release with SSA before --server-side opted in -- the CSA latch did not hold"
            exit 1
          fi
          grep -q '^helm/Update$' <<< "$managers" || {
            echo "::error::expected a helm/Update (CSA) field manager after the helm4 upgrade of a helm3 release"
            exit 1
          }
          echo "CSA latch held: helm/Update present, no helm/Apply"
          echo "::endgroup::"

          # The migration step drags the two templated multi-hundred-KB CRDs
          # through server-side apply -- exactly the objects where SSA
          # behavior differences would surface for real users.
          echo "::group::helm4 upgrade operator --server-side (the migration step)"
          helm4 upgrade op ./mcp-hangar-operator -n op --reuse-values --server-side=true --wait --timeout 300s \
            --set-string podAnnotations.ci-cross-b=1
          kubectl -n op wait --for=condition=Available deployment/op-mcp-hangar-operator --timeout=60s
          managers="$(deploy_managers op op-mcp-hangar-operator)"
          echo "$managers"
          grep -q '^helm/Apply$' <<< "$managers" || {
            echo "::error::expected a helm/Apply (SSA) field manager after the --server-side migration"
            exit 1
          }
          echo "SSA migration took: helm/Apply present"
          echo "::endgroup::"

          echo "::group::helm4 rollback operator to revision 2"
          helm4 rollback op 2 -n op --wait --timeout 300s
          kubectl -n op wait --for=condition=Available deployment/op-mcp-hangar-operator --timeout=60s
          echo "::endgroup::"

          echo "::group::release history sane"
          helm4 history op -n op
          helm4 history op -n op -o json \
            | jq -e 'length == 4 and (.[-1].status == "deployed")' > /dev/null || {
            echo "::error::expected 4 revisions with the last one deployed"
            exit 1
          }
          echo "::endgroup::"

      - name: Diagnostics (operator) on failure
        if: steps.cross_operator.outcome == 'failure'
        run: |
          echo "---- pods ----"
          kubectl -n op get pods -o wide || true
          echo "---- describe pods ----"
          kubectl -n op describe pods || true
          echo "---- crds ----"
          kubectl get crds | grep mcp-hangar.io || true
          echo "---- events ----"
          kubectl -n op get events --sort-by=.lastTimestamp || true
          echo "---- operator logs ----"
          kubectl -n op logs -l app.kubernetes.io/name=mcp-hangar-operator --all-containers --tail=300 || true
          echo "---- history ----"
          helm4 history op -n op || true

      - name: Gate on cross-upgrade results
        if: always()
        run: |
          status=0
          for pair in "core:${{ steps.cross_core.outcome }}" "operator:${{ steps.cross_operator.outcome }}"; do
            name="${pair%%:*}"
            outcome="${pair##*:}"
            echo "${name}: ${outcome}"
            if [ "$outcome" != "success" ]; then
              status=1
            fi
          done
          exit "$status"

  # The one job to mark as a required status check. It `needs` everything
  # above and runs unconditionally (`if: always()`), so it always posts a
  # result -- unlike the chart jobs, which skip on a non-chart PR and would
  # otherwise leave a required check pending forever. It fails only if a
  # needed job actually failed; a job that was itself skipped (the
  # detect.run == 'false' path) is fine.
  charts-required:
    needs: [detect, flag-guard, lint-and-render, template-parity, install-smoke, cross-upgrade]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          status=0
          for pair in \
            "detect:${{ needs.detect.result }}" \
            "flag-guard:${{ needs.flag-guard.result }}" \
            "lint-and-render:${{ needs.lint-and-render.result }}" \
            "template-parity:${{ needs.template-parity.result }}" \
            "install-smoke:${{ needs.install-smoke.result }}" \
            "cross-upgrade:${{ needs.cross-upgrade.result }}"; do
            name="${pair%%:*}"
            result="${pair##*:}"
            echo "${name}: ${result}"
            if [ "$result" = "failure" ]; then
              status=1
            fi
          done
          exit "$status"
